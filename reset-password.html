
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>婚禮管理員密碼重設</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f0;
      padding: 24px;
      color: #334438;
    }
    .card {
      max-width: 420px;
      margin: 50px auto;
      padding: 25px;
      background: white;
      border-radius: 16px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      font-size: 16px;
      border-radius: 8px;
    }
    input { border: 1px solid #ccc; }
    button {
      border: none;
      background: #52745e;
      color: white;
    }
    button:disabled { opacity: .5; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="card">
    <h2>💍 婚禮管理員密碼重設</h2>
    <p id="message">正在驗證密碼重設連結……</p>

    <form id="resetForm" hidden>
      <input id="password"
             type="password"
             placeholder="請輸入新密碼"
             minlength="12"
             autocomplete="new-password"
             required>
      <input id="confirmPassword"
             type="password"
             placeholder="再次輸入新密碼"
             minlength="12"
             autocomplete="new-password"
             required>
      <button id="submitBtn" type="submit">
        更新密碼
      </button>
    </form>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL =
    "https://pzexcoaknkpihkjxhvze.supabase.co";

  // 填入與 staff.html 相同的 Publishable Key
  const SUPABASE_KEY =
    "請替換成你的_Publishable_Key";

  const message = document.getElementById("message");
  const form = document.getElementById("resetForm");
  let recoveryReady = false;

  async function init() {
    if (!window.supabase ||
        SUPABASE_KEY === "請替換成你的_Publishable_Key") {
      message.textContent = "請先設定 Supabase Publishable Key";
      return;
    }

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          detectSessionInUrl: true,
          persistSession: false
        }
      }
    );

    const hash = new URLSearchParams(
      window.location.hash.substring(1)
    );

    if (hash.get("error")) {
      message.textContent =
        hash.get("error_description") ||
        "連結已失效，請重新寄送重設密碼信。";
      return;
    }

    db.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        recoveryReady = true;
        form.hidden = false;
        message.textContent = "驗證成功，請設定新密碼。";
      }
    });

    const { data, error } = await db.auth.initialize();

    if (error) {
      message.textContent = error.message;
      return;
    }

    // 只接受密碼重設連結，不接受一般登入
    if (!recoveryReady &&
        !window.location.hash.includes("type=recovery") &&
        !window.location.search.includes("code=")) {
      message.textContent =
        "請從最新的密碼重設 Email 開啟此頁面。";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!recoveryReady) {
        message.textContent =
          "尚未驗證重設連結，請重新寄送 Email。";
        return;
      }

      const password =
        document.getElementById("password").value;

      const confirm =
        document.getElementById("confirmPassword").value;

      if (password !== confirm) {
        message.textContent = "兩次輸入的密碼不同。";
        return;
      }

      document.getElementById("submitBtn").disabled = true;

      const { error } = await db.auth.updateUser({
        password
      });

      if (error) {
        message.textContent = error.message;
        document.getElementById("submitBtn").disabled = false;
        return;
      }

      await db.auth.signOut();

      form.hidden = true;
      message.textContent =
        "密碼更新成功！請回到 staff.html 登入。";
    });
  }

  init().catch(err => {
    message.textContent = err.message;
  });
</script>
</body>
</html>

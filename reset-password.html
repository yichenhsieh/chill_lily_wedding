
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chill & Lily｜管理員密碼重設</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #f5f5f0;
      color: #334438;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }
    .card {
      max-width: 440px;
      margin: 50px auto;
      padding: 28px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 3px 15px #00000010;
    }
    h2 { text-align: center; }
    p { line-height: 1.7; }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      font-size: 16px;
      border-radius: 9px;
    }
    input { border: 1px solid #ccc; }
    button {
      background: #52745e;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    .hidden { display: none !important; }
    .message {
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    .error { color: #b42318; }
    a { color: #52745e; }
  </style>
</head>
<body>
  <main class="card">
    <h2>💍 Chill & Lily</h2>
    <h3>管理員密碼重設</h3>

    <section id="requestSection" class="hidden">
      <p>請輸入管理員 Email，我們會寄送密碼重設連結。</p>
      <form id="requestForm">
        <input
          id="email"
          type="email"
          placeholder="管理員 Email"
          autocomplete="email"
          required
        >
        <button id="sendBtn" type="submit">
          寄送重設密碼信
        </button>
      </form>
    </section>

    <section id="updateSection" class="hidden">
      <p>已驗證重設連結，請設定新的管理員密碼。</p>
      <form id="updateForm">
        <input
          id="newPassword"
          type="password"
          placeholder="新密碼（至少 12 個字元）"
          autocomplete="new-password"
          minlength="12"
          required
        >
        <input
          id="confirmPassword"
          type="password"
          placeholder="再次輸入新密碼"
          autocomplete="new-password"
          minlength="12"
          required
        >
        <button id="updateBtn" type="submit">
          確認更新密碼
        </button>
      </form>
    </section>

    <p id="message" class="message">
      正在載入……
    </p>

    <p>
      <a href="./staff.html">返回招待登入頁面</a>
    </p>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL =
    "https://pzexcoaknkpihkjxhvze.supabase.co";

  // 請替換成與 staff.html 相同的 Publishable Key
  // 絕對不要使用 service_role 或 secret key
  const SUPABASE_KEY =
    "sb_publishable_f-6oJLkU4iQoc0JMS-PJzw_xHKDl8c2";

  const RESET_URL =
    "https://yichenhsieh.github.io/chill_lily_wedding/reset-password.html";

  const $ = id => document.getElementById(id);

  function show(id, visible) {
    $(id).classList.toggle("hidden", !visible);
  }

  function setMessage(text, isError = false) {
    $("message").textContent = text;
    $("message").className =
      isError ? "message error" : "message";
  }

  async function start() {
    if (!window.supabase) {
      setMessage("無法載入 Supabase 程式庫，請重新整理。", true);
      return;
    }

    if (SUPABASE_KEY === "請替換成你的_Publishable_Key") {
      setMessage("請先設定 Supabase Publishable Key。", true);
      return;
    }

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          detectSessionInUrl: true,
          persistSession: false,
          autoRefreshToken: false
        }
      }
    );

    let recoveryReady = false;

    const hash = new URLSearchParams(
      window.location.hash.substring(1)
    );

    if (hash.has("error")) {
      setMessage(
        "重設連結已失效，請重新寄送一封新的密碼重設信。",
        true
      );
    }

    db.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        recoveryReady = true;
        show("requestSection", false);
        show("updateSection", true);
        setMessage("驗證成功，請輸入新密碼。");
      }
    });

    $("requestForm").addEventListener("submit", async e => {
      e.preventDefault();
      $("sendBtn").disabled = true;

      try {
        const email = $("email").value.trim();

        const { error } =
          await db.auth.resetPasswordForEmail(email, {
            redirectTo: RESET_URL
          });

        if (error) throw error;

        setMessage(
          "如果此 Email 已註冊，你將收到密碼重設信。請到信箱開啟最新的連結。"
        );
      } catch (err) {
        setMessage(err.message, true);
      } finally {
        $("sendBtn").disabled = false;
      }
    });

    $("updateForm").addEventListener("submit", async e => {
      e.preventDefault();

      if (!recoveryReady) {
        setMessage("請從最新的密碼重設信開啟此頁面。", true);
        return;
      }

      const password = $("newPassword").value;
      const confirm = $("confirmPassword").value;

      if (password !== confirm) {
        setMessage("兩次輸入的密碼不一致。", true);
        return;
      }

      $("updateBtn").disabled = true;

      try {
        const { error } = await db.auth.updateUser({
          password: password
        });

        if (error) throw error;

        await db.auth.signOut();

        recoveryReady = false;
        show("updateSection", false);
        setMessage(
          "密碼更新成功！現在可以返回招待頁面，使用新密碼登入。"
        );

        window.history.replaceState(
          {},
          "",
          window.location.pathname
        );
      } catch (err) {
        setMessage(err.message, true);
        $("updateBtn").disabled = false;
      }
    });

    // 初始化時處理 Email 連結帶回的驗證資訊
 
    // 初始化時處理密碼重設連結
    const hasRecoveryLink =
      window.location.hash.includes("type=recovery") ||
      window.location.search.includes("code=");

    const { error } = await db.auth.getSession();

    if (error) {
      setMessage(error.message, true);
      show("requestSection", true);
      return;
    }

    if (hasRecoveryLink) {
      // 等待 Supabase 驗證重設連結
      show("requestSection", false);
      setMessage("正在驗證密碼重設連結……");

      // PASSWORD_RECOVERY 事件成功觸發後，
      // 前面的 onAuthStateChange 會顯示新密碼表單
    } else {
      show("requestSection", true);

      if (!hash.has("error")) {
        setMessage("請輸入管理員 Email，寄送密碼重設信。");
      }
    }
  }


  start().catch(err => {
    setMessage(err.message, true);
  });
</script>
</body>
</html>

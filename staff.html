<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>婚禮招待報到 | Chill & Lily</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="staff">
<main class="shell">
<header class="header">
  <div><div class="brand">CHILL & LILY · 2026.10.25</div><h1>婚禮招待報到</h1><div class="muted" id="staffName">工作人員專用</div></div>
  <div class="row"><a class="link" href="dashboard.html">新娘看板</a><button id="logoutBtn" class="btn secondary small hidden">登出</button></div>
</header>
<nav id="adminTabs" class="hidden" aria-label="管理員功能切換" style="margin:16px 0">
  <a class="btn" href="staff.html" aria-current="page" style="text-decoration:none;display:inline-block;margin:4px">報到／調整桌次</a>
  <a class="btn secondary" href="/chill_lily_wedding/admin-tables.html" style="text-decoration:none;display:inline-block;margin:4px">全員桌次查詢／匯出</a>
</nav>
<div id="status" class="status">正在載入……</div>
<section id="loginCard" class="card hidden">
  <h2>工作人員快速登入</h2>
  <form id="quickLoginForm" class="stack">
    <div>
      <label for="staffSelect">選擇姓名</label>
      <!-- 重要：將 YOUR_GMAIL 改成實際 Gmail @ 前的帳號名稱；若別名不同，請改為 Auth Users 的完整 Email。 -->
      <select id="staffSelect" required style="display:block;width:100%;padding:12px;border:1px solid #d6c9bf;border-radius:10px;background:white;font:inherit">
        <option value="">請選擇工作人員</option>
        <option value="YOUR_GMAIL+zhongqing@gmail.com">吳中慶｜管理員</option>
        <option value="YOUR_GMAIL+yixuan@gmail.com">林宜萱｜招待</option>
        <option value="YOUR_GMAIL+yicheng@gmail.com">王以誠｜招待</option>
        <option value="YOUR_GMAIL+xianting@gmail.com">謝獻霆｜招待</option>
      </select>
    </div>
    <div><label for="quickPassword">原本的登入密碼</label><input id="quickPassword" type="password" autocomplete="current-password" required></div>
    <button id="quickLoginBtn" class="btn full" type="submit">登入報到系統</button>
  </form>
  <details style="margin-top:20px">
    <summary style="cursor:pointer">使用 Email＋密碼登入（備援）</summary>
    <form id="loginForm" class="stack" style="margin-top:12px">
      <div><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
      <div><label for="password">密碼</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button id="loginBtn" class="btn full" type="submit">使用 Email 登入</button>
    </form>
    <a class="link" href="reset-password.html">忘記密碼？</a>
  </details>
  <p class="muted">只有已啟用的 admin / reception 工作人員可以操作。</p>
</section>
<div id="workspace" class="hidden">
  <div class="grid">
    <section class="card"><h2>掃描 QR Code</h2><p class="muted">請先核對賓客姓名與人數，再按確認報到。</p><button id="scanBtn" class="btn" type="button">開啟相機掃描</button><div id="scannerBox" class="hidden stack" style="margin-top:12px"><div id="qrReader" style="width:100%;max-width:420px;margin:auto"></div><button id="stopScanBtn" class="btn secondary" type="button">停止掃描</button></div><form id="tokenForm" class="stack" style="margin-top:14px"><label for="tokenInput">手動貼上 QR Code 內容 / Token</label><input id="tokenInput" autocomplete="off" required><button class="btn secondary" type="submit">查詢 QR Code</button></form></section>
    <section class="card"><h2>姓名搜尋</h2><label for="searchInput">輸入賓客姓名（可部分比對）</label><input id="searchInput" placeholder="例如：王小美" autocomplete="off"><div id="searchResults" aria-live="polite"></div></section>
  </div>
  <section id="selectedGuest" class="card hidden"><div class="header"><h2 id="guestName">賓客姓名</h2><span id="guestState" class="pill">尚未報到</span></div><div class="grid3"><div><div class="muted">桌次</div><div class="metric" id="guestTable">—</div></div><div><div class="muted">預計人數</div><div class="metric" id="guestExpected">—</div></div><div><div class="muted">已報到人數</div><div class="metric" id="guestChecked">—</div></div></div><hr style="border:0;border-top:1px solid #eee3d8;margin:20px 0"><div class="grid"><div><label for="checkinCount">本次實際報到人數</label><input id="checkinCount" type="number" min="1" step="1"><button id="checkinBtn" class="btn full" type="button" style="margin-top:10px">確認報到</button><p class="muted">為避免重複計數，已報到的賓客不能再次報到。</p></div><div id="seatSection" class="hidden"><label for="changeTable">調整桌次（限管理員）</label><input id="changeTable" type="number" min="1" step="1"><button id="seatBtn" class="btn secondary full" type="button" style="margin-top:10px">確認更換桌次</button></div></div></section>
</div>
<footer class="foot">Chill & Lily · 工作人員系統 · 請勿分享登入資訊</footer>
</main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="app.js"></script>
</body></html>


<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chill & Lily 婚禮招待系統</title>
  <style>
    body {
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f5f5f0;
      color: #334438;
      margin: 0;
      padding: 20px;
    }
    main { max-width: 500px; margin: auto; }
    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      margin: 16px 0;
      box-shadow: 0 2px 12px #00000010;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 9px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      border: 0;
      background: #52745e;
      color: white;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    .hidden { display: none; }
    .error { color: #b42318; }
    .hint { color: #66756a; font-size: 14px; }
    .result p { border-bottom: 1px solid #eee; padding: 8px 0; }
  </style>
</head>
<body>
<main>
  <h2>💍 Chill & Lily 婚禮招待</h2>
  <p class="hint">測試版本：只開放登入及賓客查詢</p>

  <div id="setup" class="card hidden">
    請先設定 Supabase Publishable Key。
  </div>

  <section id="loginBox" class="card hidden">
    <h3>工作人員登入</h3>
    <form id="loginForm">
      <input id="email" type="email"
             placeholder="Email" required>
      <input id="password" type="password"
             placeholder="密碼" required>
      <button id="loginBtn">登入</button>
    </form>
    <p id="loginMessage"></p>
  </section>

  <section id="staffBox" class="card hidden">
    <p id="staffName"></p>
    <button id="logoutBtn">登出</button>
  </section>

  <section id="searchBox" class="card hidden">
    <h3>賓客查詢</h3>
    <p class="hint">
      請先貼上賓客原始 QR Token。
      掃描相機功能將在下一階段加入。
    </p>
    <form id="searchForm">
      <input id="qrToken"
             placeholder="請輸入 QR Token" required>
      <button id="searchBtn">查詢賓客</button>
    </form>
    <p id="searchMessage"></p>
    <div id="result" class="result hidden">
      <p>姓名：<strong id="guestName"></strong></p>
      <p>桌次：<strong id="tableNumber"></strong></p>
      <p>預計人數：<strong id="expectedCount"></strong></p>
      <p>報到狀態：<strong id="checkinStatus"></strong></p>
      <p>實到人數：<strong id="checkedCount"></strong></p>
      <p>報到時間：<strong id="checkedAt"></strong></p>
    </div>
    <p class="hint">🔒 本頁不會修改賓客資料。</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL =
    "https://pzexcoaknkpihkjxhvze.supabase.co";

  // 請填入 Supabase 的 Publishable Key
  // 不可以使用 service_role 或 secret key
  const SUPABASE_KEY =
    "sb_publishable_f-6oJLkU4iQoc0JMS-PJzw_xHKDl8c2";

  const $ = id => document.getElementById(id);
  const show = (id, visible) => {
    $(id).classList.toggle("hidden", !visible);
  };
  const msg = (id, text, isError = false) => {
    $(id).textContent = text;
    $(id).className = isError ? "error" : "";
  };

  let db;
  let staff = null;

  async function refreshLogin() {
    show("staffBox", false);
    show("searchBox", false);
    staff = null;

    const { data: { session } } =
      await db.auth.getSession();

    if (!session) {
      show("loginBox", true);
      return;
    }

    const { data, error } =
      await db.rpc("get_my_staff_profile");

    if (error || !data?.length) {
      await db.auth.signOut();
      show("loginBox", true);
      msg("loginMessage",
        error?.message || "帳號沒有工作人員權限",
        true);
      return;
    }

    staff = data[0];
    show("loginBox", false);
    show("staffBox", true);

    $("staffName").textContent =
      "已登入：" + staff.display_name +
      "（" + staff.staff_role + "）";

    show("searchBox",
      ["admin", "reception"].includes(staff.staff_role));
  }

  $("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    $("loginBtn").disabled = true;

    try {
      const { error } = await db.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("password").value
      });

      if (error) throw error;

      $("password").value = "";
      await refreshLogin();
    } catch (err) {
      msg("loginMessage", err.message, true);
    } finally {
      $("loginBtn").disabled = false;
    }
  });

  $("logoutBtn").addEventListener("click", async () => {
    await db.auth.signOut();
    show("result", false);
    await refreshLogin();
  });

  $("searchForm").addEventListener("submit", async e => {
    e.preventDefault();
    show("result", false);
    $("searchBtn").disabled = true;

    try {
      if (!staff ||
          !["admin", "reception"].includes(staff.staff_role)) {
        throw new Error("沒有賓客查詢權限");
      }

      const token = $("qrToken").value.trim();

      const { data, error } =
        await db.rpc("lookup_wedding_guest", {
          p_token: token
        });

      if (error) throw error;
      if (!data?.length) {
        throw new Error("找不到賓客，請確認 QR Token");
      }

      const guest = data[0];

      $("guestName").textContent =
        guest.guest_name ?? "—";
      $("tableNumber").textContent =
        guest.table_number ?? "未安排";
      $("expectedCount").textContent =
        guest.expected_count ?? "—";
      $("checkinStatus").textContent =
        guest.is_checked_in ? "已報到" : "尚未報到";
      $("checkedCount").textContent =
        guest.checked_count ?? "—";
      $("checkedAt").textContent =
        guest.checkin_time
          ? new Date(guest.checkin_time)
              .toLocaleString("zh-TW", {
                timeZone: "Asia/Taipei"
              })
          : "—";

      show("result", true);
      msg("searchMessage", "查詢成功");
    } catch (err) {
      msg("searchMessage", err.message, true);
    } finally {
      $("searchBtn").disabled = false;
    }
  });

  if (
    SUPABASE_KEY === "請替換成你的_Publishable_Key" ||
    !window.supabase
  ) {
    show("setup", true);
  } else {
    db = window.supabase.createClient(
      SUPABASE_URL, SUPABASE_KEY
    );
    refreshLogin().catch(err => {
      show("loginBox", true);
      msg("loginMessage", err.message, true);
    });
  }
</script>
</body>
</html>

<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>新娘即時看板 | Chill & Lily</title><link rel="stylesheet" href="styles.css"></head><body data-page="dashboard"><main class="shell"><header class="header"><div><div class="brand">CHILL & LILY · 2026.10.25</div><h1>新娘即時看板</h1><div class="muted" id="staffName">管理員專用</div></div><div class="row"><a class="link" href="staff.html">招待報到</a><button id="logoutBtn" class="btn secondary small hidden">登出</button></div></header><div id="status" class="status">正在載入……</div><section id="loginCard" class="card hidden"><h2>管理員登入</h2><form id="loginForm" class="stack"><div><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div><div><label for="password">密碼</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginBtn" class="btn full" type="submit">登入看板</button></form></section><div id="workspace" class="hidden"><div class="grid3"><div class="card"><div class="muted">賓客組數</div><div class="metric" id="totalGuests">—</div></div><div class="card"><div class="muted">已報到組數</div><div class="metric" id="arrivedGuests">—</div></div><div class="card"><div class="muted">預計總人數</div><div class="metric" id="expectedPeople">—</div></div><div class="card"><div class="muted">已到場人數</div><div class="metric" id="arrivedPeople">—</div></div><div class="card"><div class="muted">尚未到場人數</div><div class="metric" id="remainingPeople">—</div></div><div class="card"><div class="muted">更新時間</div><div style="font-size:1.3rem;font-weight:650;margin:10px 0" id="updatedAt">—</div><button id="refreshBtn" class="btn secondary small" type="button">立即更新</button></div></div><p class="muted">頁面開啟期間每 15 秒自動更新一次；僅計算有啟用 QR Code 的宴客賓客。</p></div><footer class="foot">Chill & Lily · 2026.10.25</footer></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="app.js"></script></body></html>

<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>全桌次總覽 | Chill & Lily</title><link rel="stylesheet" href="styles.css"><style>
.table-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:15px 0}.table-toolbar input{flex:1;min-width:180px;padding:12px;border:1px solid #d6c9bf;border-radius:10px;font:inherit}.table-toolbar button{white-space:nowrap}.table-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.table-box{border:1px solid #e4d6ca;border-radius:14px;padding:15px;background:#fff}.table-box h3{margin:0 0 8px}.table-meta{font-size:14px;color:#796658;margin-bottom:10px}.guest-list{list-style:none;padding:0;margin:0}.guest-list li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid #f0e8e1;font-size:14px}.arrived{color:#17704f}.pending{color:#86634f}.summary{display:flex;flex-wrap:wrap;gap:16px;margin:12px 0 20px}.summary strong{font-size:21px}.summary span{display:block;color:#796658;font-size:13px}.empty{color:#8d7d73;font-size:14px}.hide{display:none!important}
.table-display-name{font-size:15px;font-weight:700;color:#795b48;margin:-2px 0 9px}.table-box h3{margin-bottom:5px}
.chair-badge{display:inline-block;background:#fff2db;color:#805316;border-radius:9px;padding:6px 10px;font-weight:700;margin:0 0 9px}.guest-list li span:first-child{flex:1}
</style></head><body><main class="shell"><header class="header"><div><div class="brand">CHILL & LILY · 2026.10.25</div><h1>管理員 · 全桌次總覽</h1><div class="muted">第 1–30 桌｜即時讀取 Supabase｜僅供管理員</div></div><div class="row"><a class="link" href="staff.html">返回報到系統</a><button id="logout" class="btn secondary small" type="button">登出</button></div></header>
<div id="status" class="status">正在檢查管理員權限……</div>
<section id="content" class="hidden"><nav aria-label="管理員功能切換" style="margin:16px 0">
  <a class="btn secondary" href="staff.html" style="text-decoration:none;display:inline-block;margin:4px">報到／調整桌次</a>
  <a class="btn" href="admin-tables.html" aria-current="page" style="text-decoration:none;display:inline-block;margin:4px">全員桌次查詢／匯出</a>
</nav><div class="table-toolbar"><input id="filter" type="search" placeholder="搜尋桌號、桌名或賓客姓名，例如 12、SAP、王小美" aria-label="搜尋桌號、桌名或姓名"><button id="refresh" class="btn secondary" type="button">重新整理</button><button id="exportCsv" class="btn" type="button">匯出 CSV（全部桌次）</button></div><div class="summary"><div><strong id="tablesCount">—</strong><span>已安排桌數</span></div><div><strong id="expected">—</strong><span>預計人數</span></div><div><strong id="arrived">—</strong><span>已報到人數</span></div><div><strong id="babyChairs">—</strong><span>🪑 嬰兒椅需求（張）</span></div><div><strong id="lastUpdated">—</strong><span>最後更新</span></div></div><div id="tableGrid" class="table-grid"></div><p class="muted">第 30 桌若未排人，會顯示為空桌。嬰兒椅標示依 10/23 座位表姓名對照；若賓客改名或新增需求，請更新資料。此頁只能查詢，不會變更桌次或報到紀錄。每 30 秒自動更新。</p></section>
</main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="admin-tables.js"></script></body></html>
